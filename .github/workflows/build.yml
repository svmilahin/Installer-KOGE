name: Build for MOS OS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "=== Files in repo ==="
          ls -laR
          echo "=== Cargo.toml ==="
          cat Cargo.toml
          echo "=== main.rs (first 20 lines) ==="
          head -n 20 src/main.rs

      - name: Install Rust toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo --version
          rustc --version

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Linux binary
        run: cross build --target x86_64-unknown-linux-musl --release

      - name: Upload ready-to-use binary
        uses: actions/upload-artifact@v4
        with:
          name: school-installer-linux
          path: target/x86_64-unknown-linux-musl/release/school-installer
