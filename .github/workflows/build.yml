name: Build for MOS OS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross
        run: cargo install cross
        
      - name: Build Linux binary
        run: cross build --target x86_64-unknown-linux-musl --release
        env:
          CROSS_NO_WARNINGS: 0  # Покажет реальный текст ошибки, если что-то пойдёт не так
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-installer
          path: target/x86_64-unknown-linux-musl/release/school-installer
