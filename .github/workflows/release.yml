name: 🚀 Auto Release

on:
  push:
    tags:
      - 'v*'  # Триггер только при пуше тега вида v1.0.0

permissions:
  contents: write  # Нужно для создания релиза

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: school-installer-linux-amd64.tar.gz
            archive_name: school-installer-linux-amd64
          - target: aarch64-unknown-linux-gnu
            asset_name: school-installer-linux-arm64.tar.gz
            archive_name: school-installer-linux-arm64

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 🔧 Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: 🏗️ Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: 📦 Create archive
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/school-installer release/school-installer
          chmod +x release/school-installer
          cd release
          tar -czf ../${{ matrix.asset_name }} school-installer
          cd ..
          echo "Archive size: $(du -h ${{ matrix.asset_name }} | cut -f1)"

      - name: 🏷️ Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 📝 Generate changelog
        id: changelog
        uses: jaywcjlove/changelog-generator@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filter: '[\s\S]*'
          template: |
            ## Что нового в v${{ steps.get_version.outputs.version }}

            ${body}

            ---
            *Автоматический релиз от GitHub Actions*

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🎉 v${{ steps.get_version.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            ${{ matrix.asset_name }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: 📢 Notify
    needs: build-and-release
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📋 Release summary
        run: |
          echo "## 🚀 Релиз завершён!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Статус:** ${{ needs.build-and-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Тег:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Коммит:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Скачать:" >> $GITHUB_STEP_SUMMARY
          echo "- [school-installer-linux-amd64.tar.gz](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/school-installer-linux-amd64.tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "- [school-installer-linux-arm64.tar.gz](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/school-installer-linux-arm64.tar.gz)" >> $GITHUB_STEP_SUMMARY
